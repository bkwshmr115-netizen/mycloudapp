<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omar AirGesture - TikTok Style</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100%; height:100%; background:#000; font-family: system-ui, sans-serif; overflow:hidden; color:white; touch-action: none; }
        
        #header { position:absolute; top:0; left:0; right:0; z-index:100; padding:14px; text-align:center; background:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); pointer-events:none; }
        #header h1 { font-size:15px; color:#00ffcc; margin:0; }
        
        #mainVideo { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; background:#000; }
        
        /* كاميرا صغيرة */
        #camera-box { position:absolute; top:55px; left:12px; width:85px; height:110px; border-radius:12px; border:2px solid #00ffcc; overflow:hidden; z-index:90; background:#000; }
        #cam, #output { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
        
        /* الأزرار الجانبية مثل تيك توك */
        #side-actions { position:absolute; right:12px; bottom:160px; z-index:80; display:flex; flex-direction:column; gap:18px; align-items:center; }
        .action-btn { display:flex; flex-direction:column; align-items:center; gap:4px; }
        .action-circle { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; justify-content:center; align-items:center; font-size:24px; backdrop-filter:blur(6px); cursor:pointer; transition:transform 0.15s; }
        .action-circle:active { transform:scale(0.9); }
        .action-count { font-size:12px; font-weight:bold; }
        
        /* معلومات الفيديو */
        #video-info { position:absolute; bottom:100px; left:14px; right:80px; z-index:80; }
        #username { font-weight:bold; font-size:15px; margin-bottom:4px; }
        #description { font-size:13px; opacity:0.95; line-height:1.4; }
        
        #status { position:absolute; top:55px; right:12px; background:rgba(0,0,0,0.8); color:#00ffcc; padding:5px 10px; border-radius:16px; font-size:11px; border:1px solid #00ffcc; z-index:90; }
        #toast { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); color:white; padding:12px 24px; border-radius:30px; font-size:16px; font-weight:bold; z-index:100; opacity:0; transition:opacity 0.3s; pointer-events:none; }
        #toast.show { opacity:1; }
        
        /* لوحة التعليقات */
        #comment-panel { position:absolute; bottom:0; left:0; right:0; height:55%; background:#1a1a1a; border-radius:18px 18px 0 0; z-index:120; transform:translateY(100%); transition:transform 0.3s ease; display:flex; flex-direction:column; }
        #comment-panel.open { transform:translateY(0); }
        #comment-header { padding:14px; text-align:center; font-weight:bold; border-bottom:1px solid #333; position:relative; }
        #close-comments { position:absolute; left:14px; top:14px; font-size:20px; cursor:pointer; }
        #comments-list { flex:1; overflow-y:auto; padding:12px; }
        .comment { padding:10px 0; border-bottom:1px solid #2a2a2a; font-size:13px; }
        .comment b { color:#00ffcc; }
        
        #controls { position:absolute; bottom:20px; left:0; right:0; display:flex; justify-content:center; gap:10px; z-index:90; }
        .btn { border:none; padding:11px 18px; border-radius:22px; font-size:13px; font-weight:bold; cursor:pointer; }
        #startBtn { background:#00ffcc; color:#000; }
        #nextBtn { background:#1e293b; color:white; border:1px solid #334155; }
    </style>
</head>
<body>

<div id="header">
    <h1>OMAR AIR GESTURE • تيك توك</h1>
</div>

<video id="mainVideo" autoplay loop playsinline></video>

<div id="camera-box">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
</div>

<div id="status">اضغط تشغيل</div>
<div id="toast"></div>

<div id="side-actions">
    <div class="action-btn" id="likeBtn">
        <div class="action-circle">❤️</div>
        <div class="action-count" id="likeCount">0</div>
    </div>
    <div class="action-btn" id="commentBtn">
        <div class="action-circle">💬</div>
        <div class="action-count">12</div>
    </div>
    <div class="action-btn" id="shareBtn">
        <div class="action-circle">➤</div>
        <div class="action-count">مشاركة</div>
    </div>
</div>

<div id="video-info">
    <div id="username">@omar_gesture</div>
    <div id="description">فيديو تجريبي • حرّك يدك للأعلى للالتالي</div>
</div>

<div id="comment-panel">
    <div id="comment-header">
        <span id="close-comments">×</span>
        التعليقات
    </div>
    <div id="comments-list">
        <div class="comment"><b>أحمد</b> • روعة 🔥</div>
        <div class="comment"><b>سارة</b> • كيف سويت الحركة؟</div>
        <div class="comment"><b>خالد</b> • تطبيق جامد</div>
        <div class="comment"><b>نورة</b> • يشتغل ممتاز</div>
        <div class="comment"><b>فهد</b> • أبي نسخة ثانية</div>
    </div>
</div>

<div id="controls">
    <button id="startBtn" class="btn">تشغيل التحكم</button>
    <button id="nextBtn" class="btn">التالي</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
    const mainVideo = document.getElementById('mainVideo');
    const camVideo = document.getElementById('cam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const toast = document.getElementById('toast');
    const likeCountEl = document.getElementById('likeCount');
    const commentPanel = document.getElementById('comment-panel');
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');

    let hands, camera, isRunning = false;
    let likeCount = 0;
    let lastGesture = 0;
    let smoothY = 0.5;
    let prevY = null;

    // مصادر متنوعة من lorem.video عشان تحس إنها لا تنتهي
    const sources = ['bunny', 'cat', 'nature', 'city', 'abstract', 'people', 'sport'];
    const durations = ['8s', '10s', '12s', '15s'];
    
    function getRandomVideo() {
        const src = sources[Math.floor(Math.random() * sources.length)];
        const dur = durations[Math.floor(Math.random() * durations.length)];
        // صيغة lorem.video
        return `https://lorem.video/\( {src}_720p_h264_ \){dur}`;
    }

    function showToast(text) {
        toast.innerText = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1200);
    }

    function loadNextVideo() {
        mainVideo.src = getRandomVideo();
        mainVideo.play().catch(()=>{});
        likeCount = Math.floor(Math.random() * 500) + 20;
        likeCountEl.innerText = likeCount;
        document.getElementById('description').innerText = "فيديو جديد • ارفع يدك للأعلى للانتقال";
        showToast("⬆️ فيديو جديد");
    }

    function detectGesture(landmarks) {
        const now = Date.now();
        if (now - lastGesture < 850) return;

        const palm = landmarks[9];
        const dy = smoothY - (prevY ?? smoothY);

        if (Math.abs(dy) > 0.06) {
            lastGesture = now;
            if (dy < 0) loadNextVideo(); // رفع اليد = التالي
            else showToast("⬇️ السابق (تجريبي)");
        }
    }

    function onResults(results) {
        canvas.width = camVideo.videoWidth;
        canvas.height = camVideo.videoHeight;
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];
            drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#00ffcc', lineWidth: 2 });
            drawLandmarks(ctx, lm, { color: '#ff2d55', lineWidth: 1, radius: 3 });

            const palm = lm[9];
            smoothY = smoothY * 0.6 + palm.y * 0.4;

            detectGesture(lm);
            statusEl.innerText = "✓ اليد متصلة";
            prevY = smoothY;
        } else {
            statusEl.innerText = "ضع يدك أمام الكاميرا";
            prevY = null;
        }
        ctx.restore();
    }

    async function start() {
        try {
            statusEl.innerText = "جاري التشغيل...";
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.65,
                minTrackingConfidence: 0.65
            });
            hands.onResults(onResults);

            camera = new Camera(camVideo, {
                onFrame: async () => { if (isRunning) await hands.send({ image: camVideo }); },
                width: 640,
                height: 480
            });
            await camera.start();
            camVideo.style.transform = canvas.style.transform = 'scaleX(-1)';
            
            isRunning = true;
            startBtn.innerText = "إيقاف";
            statusEl.innerText = "التحكم يعمل 🔮";
            loadNextVideo();
            showToast("ارفع يدك للأعلى");
        } catch (e) {
            statusEl.innerText = "خطأ في التشغيل";
            console.error(e);
        }
    }

    // الأحداث
    startBtn.onclick = () => {
        if (!isRunning) start();
        else {
            isRunning = false;
            if (camera) camera.stop();
            startBtn.innerText = "تشغيل التحكم";
            statusEl.innerText = "تم الإيقاف";
        }
    };

    nextBtn.onclick = loadNextVideo;

    document.getElementById('likeBtn').onclick = () => {
        likeCount++;
        likeCountEl.innerText = likeCount;
        showToast("❤️ تم الإعجاب");
    };

    document.getElementById('commentBtn').onclick = () => {
        commentPanel.classList.add('open');
    };

    document.getElementById('close-comments').onclick = () => {
        commentPanel.classList.remove('open');
    };

    document.getElementById('shareBtn').onclick = async () => {
        if (navigator.share) {
            try {
                await navigator.share({ title: 'Omar AirGesture', text: 'شوف هذا التطبيق', url: location.href });
            } catch(e) {}
        } else {
            showToast("تم نسخ الرابط");
        }
    };

    // أول فيديو
    window.onload = () => {
        mainVideo.src = getRandomVideo();
        mainVideo.play().catch(()=>{});
    };
</script>
</body>
</html>
