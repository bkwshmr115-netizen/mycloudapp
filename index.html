<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omar YouTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100%; height:100%; background:#000; font-family: system-ui, sans-serif; overflow:hidden; color:white; }
        
        #player {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }
        
        #status {
            position: absolute;
            top: 45px; right: 12px;
            background: rgba(0,0,0,0.75);
            color: #00f2ea;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 50;
        }
        
        #actions {
            position: absolute;
            right: 12px;
            bottom: 160px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .circle {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        #info {
            position: absolute;
            bottom: 110px;
            left: 14px; right: 80px;
            z-index: 50;
        }
        #title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #channel { font-size: 13px; opacity: 0.85; }
        
        #toast {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0;
            transition: 0.25s;
            z-index: 100;
            pointer-events: none;
        }
        #toast.show { opacity: 1; }
        
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00f2ea;
            font-size: 15px;
            z-index: 30;
        }
    </style>
</head>
<body>

<div id="player"></div>
<div id="overlay"></div>
<div id="loading">جاري التحميل...</div>
<div id="status">جاهز</div>
<div id="toast"></div>

<div id="actions">
    <div class="circle" id="likeBtn">❤️</div>
    <div class="circle">💬</div>
    <div class="circle">➤</div>
</div>

<div id="info">
    <div id="title">جاري التحميل...</div>
    <div id="channel">يوتيوب</div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const API_KEY = "AIzaSyBsasFOnySASuOoH_YcRDqA6dim24zKmKU";

    const queries = [
        "كوميديا عربية", "ضحك جزائري", "نكت جزائرية", "funny arabic",
        "sketch comedy", "try not to laugh", "funny fails",
        "حيوانات مضحكة", "funny cats", "funny dogs",
        "كرة قدم مهارات", "football skills", "طبخ عربي",
        "رقص", "تحديات", "pranks arabic"
    ];

    let player;
    let isReady = false;

    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('title');
    const channelEl = document.getElementById('channel');
    const toast = document.getElementById('toast');
    const loading = document.getElementById('loading');

    function showToast(msg) {
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1100);
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            playerVars: {
                autoplay: 1,
                controls: 0,
                modestbranding: 1,
                rel: 0,
                fs: 0,
                playsinline: 1,
                enablejsapi: 1
            },
            events: {
                onReady: () => {
                    isReady = true;
                    loadVideo();
                },
                onStateChange: (e) => {
                    if (e.data === YT.PlayerState.ENDED) {
                        loadVideo();
                    }
                },
                onError: (e) => {
                    statusEl.innerText = "خطأ في التشغيل";
                    setTimeout(loadVideo, 1500);
                }
            }
        });
    }

    async function loadVideo() {
        loading.style.display = "block";
        statusEl.innerText = "جاري البحث...";

        const query = queries[Math.floor(Math.random() * queries.length)];

        try {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=\( {encodeURIComponent(query)}&type=video&maxResults=6&key= \){API_KEY}`);
            const data = await res.json();

            if (!data.items || data.items.length === 0) {
                statusEl.innerText = "ما لقيت";
                loading.style.display = "none";
                return;
            }

            const item = data.items[Math.floor(Math.random() * data.items.length)];
            const videoId = item.id.videoId;

            if (isReady) {
                player.loadVideoById(videoId);
            }

            titleEl.innerText = item.snippet.title;
            channelEl.innerText = item.snippet.channelTitle;
            statusEl.innerText = "يعمل ✔";
            loading.style.display = "none";
            showToast("فيديو جديد");

        } catch (err) {
            statusEl.innerText = "خطأ شبكة";
            loading.style.display = "none";
        }
    }

    // سحب
    let startY = 0;
    document.addEventListener('touchstart', e => startY = e.touches[0].clientY, {passive:true});
    document.addEventListener('touchend', e => {
        const diff = startY - e.changedTouches[0].clientY;
        if (Math.abs(diff) > 70) {
            loadVideo();
        }
    }, {passive:true});

    // ضغط = إيقاف/تشغيل
    document.getElementById('overlay').addEventListener('click', () => {
        if (!player) return;
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
            showToast("إيقاف");
        } else {
            player.playVideo();
            showToast("تشغيل");
        }
    });

    document.getElementById('likeBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        showToast("❤️");
    });
</script>
</body>
</html>
