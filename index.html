<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmarShield X</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
        canvas { display: block; background: radial-gradient(circle, #0f172a, #020617); }
        #score-board { position: absolute; top: 15px; left: 15px; color: #00ffcc; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
        #game-over-screen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; }
        #game-over-screen h1 { color: #ff0055; font-size: 40px; text-shadow: 0 0 15px #ff0055; margin-bottom: 10px; }
        #btn-restart { background: #00ffcc; color: black; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; box-shadow: 0 0 15px #00ffcc; }
    </style>
</head>
<body>

    <div id="score-board">SCORE: <span id="score">0</span></div>
    
    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p style="font-size: 18px; color: #cbd5e1;">Viruses Breached the Firewall!</p>
        <button id="btn-restart" onclick="restartGame()">RESTART</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let gameOver = false;

        // Ship Object (Controlled by Touch/Drag)
        const ship = { x: canvas.width / 2, y: canvas.height - 100, width: 50, height: 40, speed: 8 };

        let lasers = [];
        let enemies = [];

        // Touch Interaction
        window.addEventListener("touchmove", (e) => {
            if (gameOver) return;
            const touch = e.touches[0];
            ship.x = touch.clientX - ship.width / 2;
            // Prevent ship out of screen
            if (ship.x < 0) ship.x = 0;
            if (ship.x > canvas.width - ship.width) ship.x = canvas.width - ship.width;
        });

        // Auto Fire Lasers
        setInterval(() => {
            if (!gameOver) {
                lasers.push({ x: ship.x + ship.width / 2 - 3, y: ship.y, width: 6, height: 15, speed: 10 });
            }
        }, 300);

        // Spawn Enemies (Viruses)
        setInterval(() => {
            if (!gameOver) {
                const size = Math.random() * 20 + 20;
                enemies.push({ x: Math.random() * (canvas.width - size), y: -size, size: size, speed: Math.random() * 3 + 2 });
            }
        }, 800);

        function restartGame() {
            score = 0;
            lasers = [];
            enemies = [];
            gameOver = false;
            document.getElementById("score").innerText = score;
            document.getElementById("game-over-screen").style.display = "none";
            update();
        }

        function update() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ship (Omar's Security Core)
            ctx.fillStyle = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(ship.x + ship.width / 2, ship.y);
            ctx.lineTo(ship.x, ship.y + ship.height);
            ctx.lineTo(ship.x + ship.width, ship.y + ship.height);
            ctx.closePath();
            ctx.fill();

            // Move & Draw Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].y -= lasers[i].speed;
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(lasers[i].x, lasers[i].y, lasers[i].width, lasers[i].height);
                if (lasers[i].y < 0) lasers.splice(i, 1);
            }

            // Move & Draw Enemies (Viruses)
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                ctx.fillStyle = "#ff0055";
                ctx.beginPath();
                ctx.arc(enemies[i].x + enemies[i].size/2, enemies[i].y + enemies[i].size/2, enemies[i].size/2, 0, Math.PI * 2);
                ctx.fill();

                // Check Game Over (Enemy touches bottom)
                if (enemies[i].y > canvas.height) {
                    gameOver = true;
                    document.getElementById("game-over-screen").style.display = "block";
                }

                // Collision Detection (Laser hits Enemy)
                for (let j = lasers.length - 1; j >= 0; j--) {
                    if (lasers[j].x > enemies[i].x && lasers[j].x < enemies[i].x + enemies[i].size &&
                        lasers[j].y > enemies[i].y && lasers[j].y < enemies[i].y + enemies[i].size) {
                        enemies.splice(i, 1);
                        lasers.splice(j, 1);
                        score += 10;
                        document.getElementById("score").innerText = score;
                        break;
                    }
                }
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
