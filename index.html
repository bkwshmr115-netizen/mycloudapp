<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omar SignLink - Real Hand Tracking</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100%; height:100%; background:#0a0a1a; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #header { background:linear-gradient(90deg, #0f172a, #1e293b); padding: 15px; text-align: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #header h1 { font-size:20px; color:#00ffcc; margin:0; text-transform: uppercase; letter-spacing: 2px; }
        #subtitle { font-size:11px; color:#94a3b8; margin-top:5px; }
        #container { position:relative; width:100%; height:calc(100% - 170px); display: flex; justify-content: center; align-items: center; background: #000; }
        video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; transform: scaleX(-1); /* مرآة */ }
        #status { position:absolute; top:12px; left:50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #00ffcc; padding: 8px 18px; border-radius: 20px; font-size: 13px; border: 1px solid #00ffcc; z-index: 10; white-space: nowrap; }
        #result { height:90px; background:#0f172a; display:flex; flex-direction: column; justify-content: center; align-items: center; border-top: 2px solid #1e293b; }
        #translated { font-size:26px; font-weight:bold; color:#00ffcc; margin-bottom: 6px; }
        #info { font-size:13px; color:#94a3b8; }
    </style>
</head>
<body>

<div id="header">
    <h1>OMAR SIGNLINK</h1>
    <div id="subtitle">Real Hand Tracking with MediaPipe</div>
</div>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <div id="status">جاري تحميل نموذج الذكاء الاصطناعي...</div>
</div>

<div id="result">
    <div id="translated">ضع يدك أمام الكاميرا</div>
    <div id="info">التتبع الحقيقي يعمل الآن</div>
</div>

<!-- MediaPipe CDN الصحيح -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const translatedEl = document.getElementById('translated');

    let lastGesture = "";
    let isSpeaking = false;

    // محرك النطق الصوتي العربي
    function speak(text) {
        if (!('speechSynthesis' in window) || isSpeaking) return;
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.9;
        
        isSpeaking = true;
        utterance.onend = () => { isSpeaking = false; };
        utterance.onerror = () => { isSpeaking = false; };
        
        window.speechSynthesis.speak(utterance);
    }

    // تهيئة MediaPipe Hands
    const hands = new Hands({
        locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    function onResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            statusEl.innerText = "✓ الإشارة نشطة";
            statusEl.style.borderColor = "#00ffcc";
            statusEl.style.color = "#00ffcc";

            const landmarks = results.multiHandLandmarks[0];

            // فحص الأصابع المرفوعة (tip أعلى من pip)
            const isFingerRaised = (tip, pip) => landmarks[tip].y < landmarks[pip].y;

            const indexRaised  = isFingerRaised(8, 6);   // السبابة
            const middleRaised = isFingerRaised(12, 10); // الوسطى
            const ringRaised   = isFingerRaised(16, 14); // البنصر
            const pinkyRaised  = isFingerRaised(20, 18); // الخنصر

            // الإبهام (مقارنة أفقية لأنه يختلف)
            const thumbRaised = landmarks[4].x < landmarks[3].x; // تقريبي لليد اليمنى في المرآة

            let currentGesture = null;

            // شروط الإشارات
            if (indexRaised && middleRaised && ringRaised && pinkyRaised) {
                currentGesture = "مرحباً";
            } else if (indexRaised && middleRaised && !ringRaised && !pinkyRaised) {
                currentGesture = "شكراً";
            } else if (indexRaised && !middleRaised && !ringRaised && pinkyRaised) {
                currentGesture = "أحبك";
            } else if (!indexRaised && !middleRaised && !ringRaised && !pinkyRaised) {
                currentGesture = "نعم / موافق";
            }

            // تحديث الواجهة + نطق عند تغيير الإشارة فقط
            if (currentGesture && currentGesture !== lastGesture) {
                lastGesture = currentGesture;
                translatedEl.innerText = currentGesture;
                speak(currentGesture);
            }
        } else {
            statusEl.innerText = "ابحث عن يد...";
            statusEl.style.borderColor = "#94a3b8";
            statusEl.style.color = "#94a3b8";
            lastGesture = "";
        }
    }

    // تشغيل الكاميرا
    async function start() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width:  { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            });
            
            video.srcObject = stream;

            const camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({ image: video });
                },
                width: 640,
                height: 480
            });
            
            camera.start();
            statusEl.innerText = "جاهز - ضع يدك أمام الكاميرا";
        } catch (err) {
            console.error(err);
            statusEl.innerText = "خطأ في تشغيل الكاميرا - تأكد من الصلاحيات";
            statusEl.style.borderColor = "#ff4444";
            statusEl.style.color = "#ff4444";
        }
    }

    // دعم Cordova (إن وُجد)
    document.addEventListener('deviceready', () => {
        if (window.cordova?.plugins?.permissions) {
            const permissions = cordova.plugins.permissions;
            permissions.requestPermission(permissions.CAMERA, (status) => {
                if (status.hasPermission) {
                    start();
                } else {
                    statusEl.innerText = "يرجى منح صلاحية الكاميرا";
                }
            }, () => {
                statusEl.innerText = "خطأ في طلب الصلاحية";
            });
        } else {
            start();
        }
    }, false);

    // تشغيل عادي في المتصفح
    if (!window.cordova) {
        // انتظر قليلاً حتى تُحمّل المكتبات
        window.addEventListener('load', () => {
            setTimeout(start, 300);
        });
    }
</script>

<!-- Cordova (يُستخدم فقط داخل تطبيق Cordova) -->
<script src="cordova.js"></script>

</body>
</html>
