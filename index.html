<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omar Tok Max</title>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; video-src * data: blob:;">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100%; height:100%; background:#000; font-family: system-ui, sans-serif; overflow:hidden; color: white; }
        
        /* حاوية الفيديوهات الرأسية المطابقة لتيك توك 100% */
        #video-container { width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        #video-container::-webkit-scrollbar { display: none; }

        .video-section { position: relative; width: 100%; height: 100%; scroll-snap-align: start; background: #000; display: flex; justify-content: center; align-items: center; }
        video.tiktok-video { width: 100%; height: 100%; object-fit: cover; }

        /* شريط التفاعل الجانبي الأيمن مثل تيك توك */
        .side-actions { position: absolute; right: 15px; bottom: 120px; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .icon-circle { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 24px; backdrop-filter: blur(8px); transition: transform 0.1s; }
        .icon-circle.liked { color: #ff3b30; animation: heartBeat 0.3s; }
        .action-count { font-size: 12px; margin-top: 4px; color: #e2e8f0; font-weight: 500; }

        /* صندوق معلومات الفيديو السفلي */
        .video-overlay { position: absolute; bottom: 30px; right: 15px; left: 85px; z-index: 15; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        .username { font-weight: bold; font-size: 16px; margin-bottom: 6px; color: #00ffcc; display: flex; align-items: center; gap: 4px; }
        .username::after { content: "✓"; background: #00ffcc; color: #000; font-size: 10px; width: 14px; height: 14px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
        .description { font-size: 13px; color: #f1f5f9; line-height: 1.4; }

        /* مستشعر الكاميرا الأمامية المخفي للمعاينة الذكية */
        #cam-preview { position: absolute; top: 15px; left: 15px; width: 65px; height: 85px; border-radius: 8px; border: 1px solid #00ffcc; overflow: hidden; z-index: 30; background: #000; opacity: 0.5; }
        #cam-video { width: 100%; height: 100%; object-fit: cover; }
        #status { position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.85); color:#00ffcc; padding:6px 14px; border-radius:20px; font-size: 12px; border:1px solid #00ffcc; z-index:25; font-weight: bold; }

        /* أنيميشن نبض القلب عند الضغط */
        @keyframes heartBeat { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="status">جاري إعداد البث التيك توك اللانهائي...</div>
<div id="cam-preview"><video id="cam-video" autoplay playsinline muted></video></div>

<!-- حاوية التصفح الرأسي -->
<div id="video-container"></div>

<!-- مكتبات الذكاء الاصطناعي الرسمية السحابية لـ MediaPipe -->
<script src="https://jsdelivr.net" crossorigin="anonymous"></script>
<script src="https://jsdelivr.net" crossorigin="anonymous"></script>
<script>
    const camVideo = document.getElementById('cam-video');
    const container = document.getElementById('video-container');
    const statusEl = document.getElementById('status');

    let hands = null;
    let camera = null;
    let lastY = null;
    let lastGestureTime = 0;
    let page = 1; 

    // دالة جلب فيديوهات رأسية قصيرة ومتجددة تلقائياً عبر السحابة
    async function fetchMoreVideos() {
        try {
            const response = await fetch(`https://pexels.com{page}`, {
                headers: { 'Authorization': '53307151-6d7c-44cb-b9bf-98d9bb0be7c8' } // اتصال سحابي آمن ومفتوح
            });
            const data = await response.json();
            
            if (data.videos && data.videos.length > 0) {
                data.videos.forEach((vid, index) => {
                    const file = vid.video_files.find(f => f.width < 1000) || vid.video_files[0];
                    
                    // توليد أرقام تفاعلات عشوائية لتبدو الواجهة حقيقية 100% مثل تيك توك
                    const randomLikes = Math.floor(Math.random() * 400) + 100;
                    const randomComments = Math.floor(Math.random() * 90) + 15;

                    const section = document.createElement('div');
                    section.className = 'video-section';
                    section.innerHTML = `
                        <video class="tiktok-video" loop playsinline muted src="${file.link}"></video>
                        
                        <div class="side-actions">
                            <div class="action-item" onclick="toggleLike(this)">
                                <div class="icon-circle">❤️</div>
                                <div class="action-count">${randomLikes}K</div>
                            </div>
                            <div class="action-item" onclick="alert('قسم التعليقات سيتم ربطه بقاعدة البيانات في الخطوة القادمة!')">
                                <div class="icon-circle">💬</div>
                                <div class="action-count">${randomComments}K</div>
                            </div>
                            <div class="action-item" onclick="alert('جاري تجهيز رابط المشاركة...')">
                                <div class="icon-circle">➤</div>
                                <div class="action-count">مشاركة</div>
                            </div>
                        </div>

                        <div class="video-overlay">
                            <div class="username">@omar_tok_official</div>
                            <div class="description">فيديو تيك توك رقم ${page * 5 + index} • تصفح ذكي بالهواء 🔮🔥</div>
                        </div>
                    `;
                    container.appendChild(section);
                });
                page++;
                handleVideoPlayback();
            }
        } catch (e) {
            console.error("خطأ البث:", e);
        }
    }
    function handleVideoPlayback() {
        const allVideos = document.querySelectorAll('.tiktok-video');
        allVideos.forEach((v, index) => {
            const rect = v.getBoundingClientRect();
            // تشغيل الفيديو الظاهر بالكامل على الشاشة وإيقاف الآخرين لحفظ موارد الجهاز
            if (rect.top >= -10 && rect.bottom <= window.innerHeight + 10) {
                if (v.paused) v.play().catch(e => {});
                
                // ذكاء التغذية اللانهائية: إذا اقترب المستخدم من النهاية، اجلب الوجبة القادمة فوراً
                if (index === allVideos.length - 2) {
                    fetchMoreVideos();
                }
            } else {
                v.pause();
            }
        });
    }

    container.addEventListener('scroll', handleVideoPlayback);

    // تفعيل وإلغاء زر الإعجاب الأحمر مع تغيير الشكل والأنيميشن
    function toggleLike(element) {
        const icon = element.querySelector('.icon-circle');
        icon.classList.toggle('liked');
    }

    // خوارزمية السحب باليد في الهواء المصلحة والمعدلة 100% لقراءة اليد الأولى بدون تجميد
    function onHandResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            statusEl.innerText = "✓ الإشارة نشطة";
            
            // تم الإصلاح: التقاط اليد الأولى الحية لتفادي تعليق السيرفر
            const handPoints = results.multiHandLandmarks[0];
            const currentY = handPoints.y; 
            const currentTime = Date.now();

            if (lastY !== null && (currentTime - lastGestureTime > 1200)) {
                const deltaY = currentY - lastY;
                
                // لوّح بيدك لأسفل في الهواء لتشغيل فيديو تيك توك القادم!
                if (deltaY > 0.08) { 
                    container.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
                    lastGestureTime = currentTime;
                } 
                // لوّح بيدك لأعلى للعودة للفيديو السابق!
                else if (deltaY < -0.08) {
                    container.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
                    lastGestureTime = currentTime;
                }
            }
            lastY = currentY;
        } else {
            statusEl.innerText = "لوّح بيدك لأسفل لقلب تيك توك...";
            lastY = null;
        }
    }

    async function startCameraSensor() {
        try {
            const constraints = { video: { facingMode: 'user', width: 320, height: 240 }, audio: false };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            camVideo.srcObject = stream;
            camVideo.style.transform = 'scaleX(-1)';

            hands = new Hands({ locateFile: (file) => `https://jsdelivr.net{file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
            hands.onResults(onHandResults);

            camera = new Camera(camVideo, {
                onFrame: async () => { if (hands) await hands.send({ image: camVideo }); },
                width: 320, height: 240
            });
            camera.start();
            
            await fetchMoreVideos();
            statusEl.innerText = "تيك توك عمر جاهز اللآن 🎬🔮";
        } catch (err) {
            statusEl.innerText = "خطأ في تشغيل المستشعر";
        }
    }

    document.addEventListener('deviceready', () => {
        if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
            cordova.plugins.permissions.requestPermission(cordova.plugins.permissions.CAMERA, (status) => {
                if (status.hasPermission) startCameraSensor();
            });
        } else {
            startCameraSensor();
        }
    }, false);
    
    window.addEventListener('load', () => { setTimeout(startCameraSensor, 500); });
</script>
<script src="cordova.js"></script>
</body>
</html>
