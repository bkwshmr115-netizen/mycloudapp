<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omar AirGesture - التحكم السحري</title>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:;">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100%; height:100%; background:#050510; font-family: system-ui, sans-serif; overflow:hidden; color: white; }
        #header { background:linear-gradient(90deg,#0f172a,#1e293b); padding:14px; text-align:center; border-bottom: 2px solid #00ffcc; }
        #header h1 { font-size:20px; color:#00ffcc; margin:0; letter-spacing:1px; }
        #subtitle { font-size:11px; color:#94a3b8; margin-top:4px; }
        
        #main-zone { display: flex; flex-direction: column; width: 100%; height: calc(100% - 160px); position: relative; }
        
        /* شاشة الكاميرا الصغيرة للمعاينة */
        #camera-preview { position: absolute; top: 10px; left: 10px; width: 100px; height: 130px; border-radius: 8px; border: 2px solid #00ffcc; overflow: hidden; z-index: 30; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* معرض الصور البرمي للاختبار */
        #gallery-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; }
        .slide { width: 85%; height: 75%; max-width: 400px; border-radius: 15px; border: 3px solid #1e293b; display: none; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); box-shadow: 0 10px 25px rgba(0,0,0,0.5); background-size: cover; background-position: center; position: relative; }
        .slide.active { display: flex; border-color: #00ffcc; animation: fadeIn 0.4s; }
        .slide-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(15,23,42,0.8); padding: 15px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; text-align: center; font-size: 16px; color: #00ffcc; }

        #status { position:absolute; top:12px; right:10px; background:rgba(0,0,0,0.8); color:#00ffcc; padding:6px 12px; border-radius:20px; font-size:12px; border:1px solid #00ffcc; z-index:20; }
        
        #result-bar { height:80px; background:#0f172a; display:flex; flex-direction:column; justify-content:center; align-items:center; border-top:2px solid #1e293b; }
        #detected-action { font-size:24px; font-weight:bold; color:#00ffcc; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div id="header">
    <h1>OMAR AIR-GESTURE</h1>
    <div id="subtitle">واجهة اختبار تحريك الصور في الهواء عن بعد</div>
</div>

<div id="main-zone">
    <div id="status">جاري التحميل...</div>
    
    <div id="camera-preview">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="gallery-container">
        <!-- صور برمجية ملونة للاختبار خلفياتها من إنتاج ألوان متناسقة وعصرية -->
        <div class="slide active" style="background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <span>الصورة الأولى 🏞️</span>
            <div class="slide-overlay">حرك يدك لليسار لرؤية الصورة التالية</div>
        </div>
        <div class="slide" style="background-image: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #333;">
            <span>الصورة الثانية 🌌</span>
            <div class="slide-overlay">استمر في التحريك والتجربة السحرية</div>
        </div>
        <div class="slide" style="background-image: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #333;">
            <span>الصورة الثالثة 🚀</span>
            <div class="slide-overlay">عد للأولى بتحريك يدك لليمين!</div>
        </div>
    </div>
</div>

<div id="result-bar">
    <div id="detected-action">لوّح بيدك (يمين / يسار)</div>
</div>

<!-- استدعاء مكتبات MediaPipe الرسمية -->
<script src="https://jsdelivr.net" crossorigin="anonymous"></script>
<script src="https://jsdelivr.net" crossorigin="anonymous"></script>

<script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const actionEl = document.getElementById('detected-action');
    const slides = document.querySelectorAll('.slide');

    let currentSlideIndex = 0;
    let hands = null;
    let camera = null;
    let lastX = null;
    let lastGestureTime = 0;

    function setStatus(text) {
        statusEl.innerText = text;
    }

    // دالة تغيير الصور بسلاسة في الواجهة
    function changeSlide(direction) {
        slides[currentSlideIndex].classList.remove('active');
        if (direction === 'next') {
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
        } else if (direction === 'prev') {
            currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
        }
        slides[currentSlideIndex].classList.add('active');
    }

    function onResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            setStatus("✓ اليد متصلة");

            // التقاط نقطة منتصف كف اليد (نقطة رقم 9) لتتبع الحركة الأفقية
            const handPoints = results.multiHandLandmarks[0];
            const currentX = handPoints[9].x; 
            const currentTime = Date.now();

            if (lastX !== null) {
                const deltaX = currentX - lastX;
                const timeDiff = currentTime - lastGestureTime;

                // منع التكرار السريع جداً (انتظار 800 مللي ثانية بين كل حركة)
                if (timeDiff > 800) {
                    // حركة سريعة لليسار (تذكر أن الكاميرا معكوسة scaleX(-1))
                    if (deltaX > 0.08) { 
                        actionEl.innerText = "⬅️ حركة لليسار (التالي)";
                        changeSlide('next');
                        lastGestureTime = currentTime;
                    } 
                    // حركة سريعة لليمين
                    else if (deltaX < -0.08) {
                        actionEl.innerText = "➡️ حركة لليمين (السابق)";
                        changeSlide('prev');
                        lastGestureTime = currentTime;
                    }
                }
            }
            lastX = currentX;
        } else {
            setStatus("ضع يدك أمام الكاميرا الصغيرة...");
            lastX = null;
        }
    }

    async function startCamera() {
        try {
            setStatus("تشغيل الكاميرا...");
            
            const constraints = {
                video: { facingMode: 'user', width: 320, height: 240 },
                audio: false
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.style.transform = 'scaleX(-1)'; // قلب الكاميرا الأمامية مثل المرآة

            if (!hands) {
                hands = new Hands({
                    locateFile: (file) => `https://jsdelivr.net{file}`
                });
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0, // 0 تجعل المعالجة خارقة السرعة على الهواتف
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });
                hands.onResults(onResults);
            }

            camera = new Camera(video, {
                onFrame: async () => {
                    if (hands) await hands.send({ image: video });
                },
                width: 320,
                height: 240
            });
            camera.start();
            setStatus("المستشعر جاهز 🔮");
        } catch (err) {
            console.error(err);
            setStatus("خطأ في تشغيل الكاميرا");
        }
    }

    document.addEventListener('deviceready', () => {
        if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
            const permissions = cordova.plugins.permissions;
            permissions.requestPermission(permissions.CAMERA, (status) => {
                if (status.hasPermission) startCamera();
                else setStatus("يرجى منح الصلاحية");
            });
        } else {
            startCamera();
        }
    }, false);

    window.addEventListener('load', () => { setTimeout(startCamera, 500); });
</script>
<script src="cordova.js"></script>
</body>
</html>
