<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omar Real Racing X</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; color: white; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box; }
        .hud-text { color: #00ffcc; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: auto; }
        .btn { background: rgba(0, 255, 204, 0.3); border: 2px solid #00ffcc; color: white; width: 70px; height: 70px; border-radius: 50%; font-size: 24px; font-weight: bold; outline: none; box-shadow: 0 0 15px #00ffcc; }
        #shop-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        .shop-btn { background: #00ffcc; color: black; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; margin: 10px; cursor: pointer; box-shadow: 0 0 15px #00ffcc; }
    </style>
</head>
<body>

    <div id="shop-screen">
        <h1 style="color: #00ffcc; text-shadow: 0 0 15px #00ffcc; font-size: 35px;">OMAR RACING GARAGE</h1>
        <p style="font-size: 18px;">Cash: $<span id="shop-cash">0</span></p>
        <div style="margin: 20px; text-align: center;">
            <p id="car-status">Current Car: Default Cyan (Speed: 100)</p>
            <button class="shop-btn" onclick="buyCar('Red Phantom', 200, 140, '#ff0055')">Buy Red Phantom ($200)</button>
            <button class="shop-btn" onclick="buyCar('Gold Bullet', 500, 180, '#ffaa00')">Buy Gold Bullet ($500)</button>
        </div>
        <button class="shop-btn" style="background: #ffffff;" onclick="startRace()">START NEXT RACE 🏁</button>
    </div>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="hud-text">SPEED: <span id="speed">0</span> KM/H</div>
            <div class="hud-text" style="color: #ffaa00; text-shadow: 0 0 10px #ffaa00;">CASH: $<span id="cash">0</span></div>
        </div>
        <div class="hud-text" style="align-self: center; font-size: 24px;" id="track-info">TRACK 1: NEON METROPOLIS</div>
        <div id="controls">
            <button class="btn" id="btn-left" ontouchstart="moveLeft=true" ontouchend="moveLeft=false">◀</button>
            <button class="btn" id="btn-right" ontouchstart="moveRight=true" ontouchend="moveRight=false">▶</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let cash = 0;
        let currentMaxSpeed = 10;
        let carColor = '#00ffcc';
        let speed = 0;
        let distance = 0;
        let trackNo = 1;
        let inRace = false;

        let playerX = 0; 
        let moveLeft = false;
        let moveRight = false;

        let enemies = [];

        function buyCar(name, cost, newSpeed, color) {
            if (cash >= cost) {
                cash -= cost;
                currentMaxSpeed = newSpeed / 10;
                carColor = color;
                document.getElementById("cash").innerText = cash;
                document.getElementById("shop-cash").innerText = cash;
                document.getElementById("car-status").innerText = `Current Car: ${name} (Speed: ${newSpeed})`;
                alert(`🎉 Successfully purchased ${name}!`);
            } else {
                alert("❌ Not enough cash! Race more to earn money.");
            }
        }

        function startRace() {
            document.getElementById("shop-screen").style.display = "none";
            inRace = true;
            speed = 0;
            distance = 0;
            enemies = [
                { routeX: -0.5, y: canvas.height / 2, speed: 4, color: '#ff0055' },
                { routeX: 0.5, y: canvas.height / 3, speed: 5, color: '#ffaa00' }
            ];
            update();
        }

        function update() {
            if (!inRace) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Simulated pseudo-3D Horizon
            ctx.fillStyle = '#07071c';
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

            // 2. Draw 3D Perspective Road lines
            let horizonY = canvas.height / 2;
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 40, horizonY);
            ctx.lineTo(canvas.width / 2 + 40, horizonY);
            ctx.lineTo(canvas.width - 50, canvas.height);
            ctx.lineTo(50, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Handle Input controls
            if (moveLeft) playerX -= 0.05;
            if (moveRight) playerX += 0.05;
            if (speed < currentMaxSpeed) speed += 0.1;

            distance += speed;
            document.getElementById("speed").innerText = Math.round(speed * 20);

            // Draw & Update AI Competitors
            enemies.forEach((enemy) => {
                enemy.y += (speed - enemy.speed);
                if (enemy.y > canvas.height) {
                    enemy.y = horizonY;
                    enemy.routeX = (Math.random() - 0.5) * 1.2;
                }
                
                // Real Perspective Calculations
                let scale = (enemy.y - horizonY) / horizonY;
                if(scale > 0) {
                    let enemyX = (canvas.width / 2) + (enemy.routeX * canvas.width / 2 * scale);
                    ctx.fillStyle = enemy.color;
                    ctx.fillRect(enemyX - (25 * scale), enemy.y, 50 * scale, 30 * scale);
                }
            });

            // Draw Omar's Car (Bottom Center)
            let myCarX = (canvas.width / 2) + (playerX * canvas.width / 2) - 40;
            ctx.fillStyle = carColor;
            ctx.shadowBlur = 15; ctx.shadowColor = carColor;
            ctx.fillRect(myCarX, canvas.height - 150, 80, 45); // Body
            ctx.fillStyle = '#000';
            ctx.fillRect(myCarX - 10, canvas.height - 140, 10, 25); // Tires
            ctx.fillRect(myCarX + 80, canvas.height - 140, 10, 25);
            ctx.shadowBlur = 0;

            // Track Finish Line system
            if (distance > 2000) {
                inRace = false;
                let prize = trackNo * 150;
                cash += prize;
                trackNo++;
                document.getElementById("cash").innerText = cash;
                document.getElementById("shop-cash").innerText = cash;
                document.getElementById("track-info").innerText = `TRACK ${trackNo}: CYBER HIGHWAY`;
                document.getElementById("shop-screen").style.display = "flex";
                alert(`🏁 RACE FINISHED! You won $${prize}. Garage unlocked!`);
                return;
            }

            requestAnimationFrame(update);
        }
    </script>
</body>
</html>
