<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Omar Gesture • YouTube Shorts</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: white;
    font-family: system-ui, sans-serif;
    touch-action: none;
}

#player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #00f2ea;
    font-size: 15px;
    z-index: 30;
}

#status {
    position: fixed;
    top: 45px;
    right: 12px;
    background: rgba(0,0,0,.75);
    color: #00f2ea;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 50;
}

#actions {
    position: fixed;
    right: 12px;
    bottom: 160px;
    z-index: 40;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;

    background: rgba(255,255,255,.16);
    backdrop-filter: blur(6px);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
    cursor: pointer;
    user-select: none;
}

.circle:active {
    transform: scale(.9);
}

#info {
    position: fixed;
    bottom: 110px;
    left: 14px;
    right: 80px;
    z-index: 40;
}

#title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 4px;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

#channel {
    font-size: 13px;
    opacity: .85;
}

#toast {
    position: fixed;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    background: rgba(0,0,0,.9);
    color: white;

    padding: 12px 24px;
    border-radius: 30px;

    font-size: 16px;
    font-weight: 700;

    opacity: 0;
    transition: .25s;

    z-index: 100;
    pointer-events: none;
}

#toast.show {
    opacity: 1;
}
</style>
</head>

<body>

<div id="player"></div>

<div id="loading">
    جاري تحميل فيديو من يوتيوب...
</div>

<div id="status">
    جاهز
</div>

<div id="toast"></div>

<div id="actions">

    <div class="circle" id="likeBtn">
        ❤️
    </div>

    <div class="circle" id="commentBtn">
        💬
    </div>

    <div class="circle" id="shareBtn">
        ➤
    </div>

    <div class="circle" id="soundBtn">
        🔊
    </div>

</div>

<div id="info">

    <div id="title">
        جاري التحميل...
    </div>

    <div id="channel">
        @omar_gesture
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================
   الإعدادات
========================= */

const API_KEY = "YOUR_API_KEY_HERE";

const queries = [
    "كوميديا عربية",
    "ضحك جزائري",
    "sketch comedy",
    "funny fails",
    "طبخ عربي",
    "cooking arabic",
    "رقص",
    "dance",
    "حيوانات مضحكة",
    "funny animals",
    "كرة قدم",
    "football skills",
    "سفر",
    "travel vlog",
    "موسيقى عربية",
    "arabic music",
    "نكت جزائرية",
    "تحديات",
    "pranks"
];


/* =========================
   المتغيرات
========================= */

let player = null;
let currentVideoId = null;
let isPlayerReady = false;
let isMuted = false;

let startY = 0;
let startX = 0;


/* =========================
   عناصر الصفحة
========================= */

const statusEl = document.getElementById("status");
const titleEl = document.getElementById("title");
const channelEl = document.getElementById("channel");
const toast = document.getElementById("toast");
const loading = document.getElementById("loading");

const likeBtn = document.getElementById("likeBtn");
const commentBtn = document.getElementById("commentBtn");
const shareBtn = document.getElementById("shareBtn");
const soundBtn = document.getElementById("soundBtn");


/* =========================
   رسالة مؤقتة
========================= */

function showToast(message) {

    toast.innerText = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1200);
}


/* =========================
   YouTube API
========================= */

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        height: "100%",
        width: "100%",

        playerVars: {

            autoplay: 1,
            controls: 0,
            modestbranding: 1,
            rel: 0,
            fs: 0,
            playsinline: 1,
            iv_load_policy: 3

        },

        events: {

            onReady: function () {

                isPlayerReady = true;

                loadRandomVideo();

            },

            onStateChange: function(event) {

                if (event.data === YT.PlayerState.ENDED) {

                    loadRandomVideo();

                }

            },

            onError: function() {

                statusEl.innerText = "تعذر تشغيل الفيديو";

                showToast("تعذر تشغيل الفيديو");

            }

        }

    });

}


/* =========================
   تحميل فيديو عشوائي
========================= */

async function loadRandomVideo() {

    if (!isPlayerReady || !player) {
        return;
    }

    loading.style.display = "block";

    statusEl.innerText = "جاري البحث...";

    const query =
        queries[Math.floor(Math.random() * queries.length)];


    try {

        /*
         * تم إصلاح الخطأ هنا:
         *
         * ${encodeURIComponent(query)}
         * ${API_KEY}
         */

        const url =
            `https://www.googleapis.com/youtube/v3/search` +
            `?part=snippet` +
            `&q=${encodeURIComponent(query)}` +
            `&type=video` +
            `&videoDuration=medium` +
            `&maxResults=10` +
            `&key=${API_KEY}`;


        const response = await fetch(url);

        if (!response.ok) {

            throw new Error(
                "HTTP Error: " + response.status
            );

        }


        const data = await response.json();


        if (data.error) {

            console.error(data.error);

            throw new Error(
                data.error.message || "YouTube API Error"
            );

        }


        if (!data.items || data.items.length === 0) {

            statusEl.innerText = "لم يتم العثور على فيديو";

            loading.style.display = "none";

            showToast("لم أجد فيديو");

            return;

        }


        /*
         * اختيار فيديو عشوائي
         */

        let item =
            data.items[
                Math.floor(Math.random() * data.items.length)
            ];


        currentVideoId = item.id.videoId;


        /*
         * تحديث المعلومات
         */

        titleEl.innerText =
            item.snippet.title;

        channelEl.innerText =
            item.snippet.channelTitle;


        /*
         * تشغيل الفيديو
         */

        player.loadVideoById({
            videoId: currentVideoId
        });


        statusEl.innerText = "يعمل ✔";

        loading.style.display = "none";

        showToast("فيديو جديد");


    } catch (error) {

        console.error(error);

        statusEl.innerText =
            "خطأ في التحميل";

        loading.style.display =
            "none";

        showToast("تحقق من API Key والإنترنت");

    }

}


/* =========================
   الضغط على الفيديو
========================= */

document
.getElementById("player")
.addEventListener("click", function() {

    if (!player) {
        return;
    }


    const state =
        player.getPlayerState();


    if (state === YT.PlayerState.PLAYING) {

        player.pauseVideo();

        showToast("⏸ إيقاف");

    } else {

        player.playVideo();

        showToast("▶ تشغيل");

    }

});


/* =========================
   السحب
========================= */

document.addEventListener(
    "touchstart",
    function(event) {

        startY =
            event.touches[0].clientY;

        startX =
            event.touches[0].clientX;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    function(event) {

        const endY =
            event.changedTouches[0].clientY;

        const endX =
            event.changedTouches[0].clientX;


        const diffY =
            startY - endY;

        const diffX =
            startX - endX;


        /*
         * نتأكد أن الحركة عمودية
         */

        if (Math.abs(diffY) < 70) {
            return;
        }

        if (Math.abs(diffY) < Math.abs(diffX)) {
            return;
        }


        /*
         * في الاتجاهين نحمل فيديو جديد
         */

        if (diffY > 0) {

            showToast("⬆ التالي");

        } else {

            showToast("⬇ فيديو جديد");

        }

        loadRandomVideo();

    },
    {
        passive: true
    }
);


/* =========================
   إعجاب
========================= */

likeBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        likeBtn.innerText = "💖";

        showToast("❤️ أعجبني");

    }
);


/* =========================
   تعليق
========================= */

commentBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        showToast("💬 التعليقات");

    }
);


/* =========================
   مشاركة
========================= */

shareBtn.addEventListener(
    "click",
    async function(event) {

        event.stopPropagation();


        if (!currentVideoId) {

            showToast("لا يوجد فيديو");

            return;

        }


        const videoUrl =
            `https://www.youtube.com/watch?v=${currentVideoId}`;


        try {

            if (navigator.share) {

                await navigator.share({

                    title: titleEl.innerText,

                    text:
                        "شاهد هذا الفيديو",

                    url: videoUrl

                });

            } else {

                await navigator.clipboard.writeText(
                    videoUrl
                );

                showToast("تم نسخ الرابط 📋");

            }

        } catch (error) {

            console.log(error);

        }

    }
);


/* =========================
   الصوت
========================= */

soundBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        if (!player) {
            return;
        }


        if (isMuted) {

            player.unMute();

            soundBtn.innerText = "🔊";

            isMuted = false;

            showToast("🔊 الصوت يعمل");

        } else {

            player.mute();

            soundBtn.innerText = "🔇";

            isMuted = true;

            showToast("🔇 كتم الصوت");

        }

    }
);

</script>

</body>
</html>
