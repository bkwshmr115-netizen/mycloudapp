<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omar SignLink - Real Hand Tracking</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body, html { width:100%; height:100%; background:#0a0e17; font-family: 'Segoe UI', sans-serif; color:white; overflow:hidden; }
  #header { background:linear-gradient(90deg,#0f172a,#1e1b4b); padding:12px; text-align:center; border-bottom:2px solid #00ffcc; }
  #header h1 { font-size:20px; color:#00ffcc; margin:0; }
  #subtitle { font-size:11px; color:#94a3b8; margin-top:3px; }
  #container { position:relative; width:100%; height:calc(100% - 140px); background:#000; }
  video, canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #status { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); padding:6px 14px; border-radius:20px; font-size:12px; z-index:10; border:1px solid #334155; }
  #result { height:90px; background:#0f172a; display:flex; flex-direction:column; align-items:center; justify-content:center; border-top:1px solid #1e293b; }
  #translated { font-size:24px; font-weight:bold; color:#00ffcc; min-height:32px; }
  #info { font-size:12px; color:#94a3b8; margin-top:4px; }
</style>
</head>
<body>

<div id="header">
  <h1>OMAR SIGNLINK</h1>
  <div id="subtitle">Real Hand Tracking with MediaPipe</div>
</div>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">جاري تحميل نموذج الذكاء الاصطناعي...</div>
</div>

<div id="result">
  <div id="translated">ضع يدك أمام الكاميرا</div>
  <div id="info">التتبع الحقيقي يعمل الآن</div>
</div>

<!-- مكتبات MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const translatedEl = document.getElementById('translated');

  let lastGesture = "";
  let gestureTimeout = null;

  // تهيئة MediaPipe Hands
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });

  hands.onResults(onResults);

  function onResults(results) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      statusEl.innerText = "يد مكتشفة ✓";
      statusEl.style.borderColor = "#00ffcc";
      statusEl.style.color = "#00ffcc";

      for (const landmarks of results.multiHandLandmarks) {
        // رسم التوصيلات والنقاط
        drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00ffcc', lineWidth: 3});
        drawLandmarks(ctx, landmarks, {color: '#ff0055', lineWidth: 1, radius: 4});

        // تحليل بسيط للإشارة
        const gesture = detectBasicGesture(landmarks);
        if (gesture && gesture !== lastGesture) {
          lastGesture = gesture;
          translatedEl.innerText = gesture;
          speak(gesture);

          clearTimeout(gestureTimeout);
          gestureTimeout = setTimeout(() => {
            lastGesture = "";
          }, 2000);
        }
      }
    } else {
      statusEl.innerText = "لا توجد يد في الإطار";
      statusEl.style.borderColor = "#334155";
      statusEl.style.color = "#94a3b8";
    }
    ctx.restore();
  }

  // قواعد بسيطة جداً لبعض الإشارات الأساسية
  function detectBasicGesture(landmarks) {
    // أطراف الأصابع
    const thumbTip = landmarks[4];
    const indexTip = landmarks[8];
    const middleTip = landmarks[12];
    const ringTip = landmarks[16];
    const pinkyTip = landmarks[20];

    // مفاصل وسط الأصابع
    const indexPip = landmarks[6];
    const middlePip = landmarks[10];
    const ringPip = landmarks[14];
    const pinkyPip = landmarks[18];

    // هل الأصابع ممدودة؟
    const indexUp = indexTip.y < indexPip.y;
    const middleUp = middleTip.y < middlePip.y;
    const ringUp = ringTip.y < ringPip.y;
    const pinkyUp = pinkyTip.y < pinkyPip.y;

    // يد مفتوحة
    if (indexUp && middleUp && ringUp && pinkyUp) {
      return "يد مفتوحة / سلام";
    }

    // قبضة (معظم الأصابع مطوية)
    if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
      return "قبضة يد";
    }

    // إشارة إعجاب تقريبية (إبهام مرتفع)
    if (thumbTip.y < landmarks[3].y && !indexUp && !middleUp) {
      return "إعجاب (Thumbs Up)";
    }

    return null;
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA';
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
  }

  // تشغيل الكاميرا
  async function start() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480
      });
      camera.start();

      statusEl.innerText = "جاري التتبع...";
    } catch (err) {
      statusEl.innerText = "خطأ في فتح الكاميرا";
      console.error(err);
    }
  }

  document.addEventListener('deviceready', () => {
    var permissions = cordova.plugins.permissions;
    permissions.requestPermission(permissions.CAMERA, (status) => {
        if (status.hasPermission) {
            // سيتم تشغيل الكاميرا فقط بعد موافقة المستخدم
            start(); 
        } else {
            statusEl.innerText = "يرجى منح صلاحية الكاميرا";
        }
    }, () => {
        statusEl.innerText = "خطأ في طلب الصلاحية";
    });
}, false);

</script>
</body>
</html>
