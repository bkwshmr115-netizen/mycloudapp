<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLock AI - الإصدار الحديدي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #08080c; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #11121a; padding: 20px; text-align: center; border-bottom: 2px solid #ff1a40; }
        header h1 { font-size: 1.4rem; color: #ff1a40; }
        header p { font-size: 0.8rem; color: #6b7280; margin-top: 5px; }

        .panel { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; justify-content: center; align-items: center; }
        .status-shield { font-size: 3.5rem; color: #ff1a40; animation: float 3s ease-in-out infinite; }
        .info-txt { font-size: 0.95rem; text-align: center; color: #a0aec0; max-width: 280px; line-height: 1.5; }
        
        .action-btn { background: linear-gradient(135deg, #ff1a40, #b30022); color: #fff; border: none; padding: 16px 40px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 26, 64, 0.4); width: 100%; max-width: 300px; text-align: center; }
        
        /* 🚨 واجهة شاشة القفل الحديدية المفروضة فوق النظام */
        #iron-lockscreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .lock-title { font-size: 2.2rem; font-weight: bold; color: #fff; font-family: monospace; margin-bottom: 5px; }
        .lock-hint { font-size: 0.85rem; color: #ff1a40; margin-bottom: 20px; text-align: center; }
        .pin-input { background: #111; border: 2px solid #222; width: 100%; max-width: 280px; padding: 12px; border-radius: 10px; font-size: 1.4rem; text-align: center; letter-spacing: 6px; color: #ff1a40; font-weight: bold; outline: none; margin-bottom: 20px; }
        
        .grid-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 260px; }
        .k-btn { background: #12131a; border: 1px solid #242636; color: #fff; font-size: 1.4rem; font-weight: bold; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; cursor: pointer; }
        .k-btn:active { background: #ff1a40; color: #000; }

        #secret-cam-holder { width: 1px; height: 1px; opacity: 0.01; position: absolute; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية للتطبيق -->
    <header>
        <h1>🛡️ OMNILOCK AI</h1>
        <p>نظام القفل الحديدي المستقل وحماية الذاكرة - عمر</p>
    </header>

    <div class="panel">
        <div class="status-shield">🔒</div>
        <div class="info-txt">اضغط على الزر أدناه لإطلاق واجهة القفل الحديدية فوراً واختبار الحماية وفخ الكاميرا السرية على هاتفك.</div>
        <button class="action-btn" id="launch-lock-btn">إطلاق واجهة القفل الحديدية</button>
    </div>

    <!-- 🚨 شاشة القفل المفروضة قسرياً فوق النظام -->
    <div id="iron-lockscreen">
        <div style="font-size: 3rem; margin-bottom: 10px;">🔒</div>
        <div class="lock-title" id="clock-display">00:00</div>
        <div class="lock-hint" id="alert-hint">مطلوب الرمز السري الثنائي لفك قفل الجهاز</div>
        
        <input type="password" class="pin-input" id="pin-field" readonly placeholder="••••">
        
        <div class="grid-keypad">
            <div class="k-btn" onclick="tapNum('1')">1</div>
            <div class="k-btn" onclick="tapNum('2')">2</div>
            <div class="k-btn" onclick="tapNum('3')">3</div>
            <div class="k-btn" onclick="tapNum('4')">4</div>
            <div class="k-btn" onclick="tapNum('5')">5</div>
            <div class="k-btn" onclick="tapNum('6')">6</div>
            <div class="k-btn" onclick="tapNum('7')">7</div>
            <div class="k-btn" onclick="tapNum('8')">8</div>
            <div class="k-btn" onclick="tapNum('9')">9</div>
            <div class="k-btn" style="color:#ff3333; font-size:1rem;" onclick="clearField()">حذف</div>
            <div class="k-btn" onclick="tapNum('0')">0</div>
            <div class="k-btn" style="color:#00ff88; font-size:1rem;" onclick="validatePin()">دخول</div>
        </div>
    </div>

    <div id="secret-cam-holder">
        <video id="view-cam" autoplay playsinline></video>
        <canvas id="draw-canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const launchLockBtn = document.getElementById('launch-lock-btn');
        const ironLockscreen = document.getElementById('iron-lockscreen');
        const pinField = document.getElementById('pin-field');
        const alertHint = document.getElementById('alert-hint');
        const viewCam = document.getElementById('view-cam');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');

        const SECRET_PIN = "1234";
        let inputBuffer = "";

        // تحديث الساعة حياً
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock-display').innerText = d.toTimeString().split(' ').substring(0, 5);
        }, 1000);

        // تشغيل الكاميرا فوراً في الخلفية سرياً
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(s => { viewCam.srcObject = s; })
            .catch(e => console.log("الكاميرا مطلوبة للفخ"));

        // زر الإطلاق الفوري المباشر للميزة الحديدية
        launchLockBtn.addEventListener('click', function() {
            ironLockscreen.style.display = 'flex';
        });

        function tapNum(n) {
            if (inputBuffer.length < 4) {
                inputBuffer += n;
                pinField.value = inputBuffer;
            }
        }

        function clearField() {
            inputBuffer = "";
            pinField.value = "";
        }

        function validatePin() {
            if (inputBuffer === SECRET_PIN) {
                alertHint.innerText = "تم فك القفل بنجاح!";
                alertHint.style.color = "#00ff88";
                setTimeout(() => { ironLockscreen.style.display = 'none'; clearField(); }, 600);
            } else {
                alertHint.innerText = "⚠️ رمز خاطئ! تم التقاط ملامحك وتأمين الذاكرة.";
                alertHint.style.color = "#ff1a40";

                // تشغيل فخ الكاميرا المخفية فوراً وحفظ الصورة في ذاكرة الهاتف
                ctx.drawImage(viewCam, 0, 0, canvas.width, canvas.height);
                const base64Data = canvas.toDataURL('image/jpeg');

                fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Data, alert: "intrusion_detected" })
                });

                clearField();
            }
        }
    </script>
</body>
</html>
